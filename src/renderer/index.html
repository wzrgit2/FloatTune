<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FloatTune</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="card">
  <div id="full">
    <div id="cover"><img id="coverImg" alt=""><div id="coverPh">♪</div></div>
    <div id="mid">
      <div id="title">未在播放</div>
      <div id="artist">—</div>
      <div id="bar"><div id="barFill"></div><div id="barKnob"></div></div>
      <div id="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div id="right">
      <div id="btns">
        <button id="prev" title="上一首">◀◀</button>
        <button id="toggle" title="播放/暂停">▶</button>
        <button id="next" title="下一首">▶▶</button>
      </div>
    </div>
  </div>

  <div id="minibar">
    <div id="miniCover"><img id="miniCoverImg" alt=""><span id="miniPh">♪</span></div>
    <div id="miniTitle">未在播放</div>
    <div id="miniBtns">
      <button id="mPrev" title="上一首">◀◀</button>
      <button id="mToggle" title="播放/暂停">▶</button>
      <button id="mNext" title="下一首">▶▶</button>
    </div>
  </div>

  <button id="pin" title="固定窗口（锁定位置与大小）">📌</button>
  <button id="settings" title="设置">⚙</button>
  <button id="min" title="最小化到托盘">—</button>
  <button id="close" title="退出">✕</button>
  <div id="grip" title="拖动调整大小"></div>
</div>
<script src="app.js"></script>
</body>
</html>
